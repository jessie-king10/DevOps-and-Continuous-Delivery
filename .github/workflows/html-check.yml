name: Website CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run HTMLHint
        run: npx --yes htmlhint index.html

      - name: Build Docker image
        run: docker build -t the-book-nook .

      - name: Test website container
        run: |
          docker run -d -p 8080:80 --name book-nook-test the-book-nook
          sleep 3
          curl --fail --silent --show-error --output /dev/null http://localhost:8080
          docker stop book-nook-test
